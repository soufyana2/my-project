<!-- Script محسن للأداء -->
<script>
    (function() {
        const section = document.getElementById('categories-section');
        if (!section) return;

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                const hiddenElements = section.querySelectorAll('.cat-card-hidden');
                hiddenElements.forEach((el, index) => {
                    setTimeout(() => {
                        el.classList.add('cat-card-visible');
                    }, index * 100); // جعلنا الفرق 100ms ليكون أسرع قليلاً
                });
                observer.unobserve(section);
            }
        }, { threshold: 0.1 });

        observer.observe(section);
    })();
</script>
