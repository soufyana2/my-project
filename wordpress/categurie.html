<style>
    /* Animation classes */
    .cat-card-hidden {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        will-change: opacity, transform;
    }
    
    .cat-card-visible {
        opacity: 1;
        transform: translateY(0);
    }

    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
</style>

<section id="categories-section" class="font-cairo flex flex-col items-center py-6 bg-transparent !mb-0 md:!mb-0">

    <!-- Title -->
    <h2 class="text-3xl md:text-4xl font-bold text-text-dark mb-6 md:mb-8 cat-card-hidden text-center">
        __STORE_HOME_CATEGORIES_TITLE__
    </h2>

    <!-- 
       Container: 
       1. justify-center: Centers items on mobile and desktop
       2. flex-wrap (optional on mobile if you want rows, but keep overflow-x-auto if you want scroll safe)
          Since you have 4 items, they likely fit centered. 
    -->
    <div class="flex justify-center flex-wrap md:flex-wrap gap-4 md:gap-10 w-full max-w-6xl px-4 pb-4">
        __STORE_HOME_CATEGORIES_ITEMS__

    </div>
</section>

<!-- Script for Animation on Scroll -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const hiddenElements = entry.target.querySelectorAll('.cat-card-hidden');
                    hiddenElements.forEach((el, index) => {
                        setTimeout(() => {
                            el.classList.add('cat-card-visible');
                        }, index * 150);
                    });
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.2 });

        const section = document.getElementById('categories-section');
        if (section) observer.observe(section);
    });
</script>
