<style>
    .custom-banner-wrapper {
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        cursor: pointer;
    }

    .shim-loader {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: customShimmer 1.5s infinite forwards;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 20;
        transition: opacity 0.5s ease-in-out;
    }

    @keyframes customShimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }

    .custom-banner-wrapper img {
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
    }

    .custom-banner-wrapper.reveal-banner {
        opacity: 1;
    }
    
    /* عند ظهور الصورة، نخفي الـ skeleton ونظهر الصورة */
    .custom-banner-wrapper.loaded img {
        opacity: 1;
    }
</style>

<section id="secondaryBannerArea" 
   class="custom-banner-wrapper bg-gray-100 w-full max-w-sm sm:max-w-full lg:h-80 h-32
          mx-auto flex items-center justify-center text-white overflow-hidden relative shadow-sm border border-gray-200 mt-8 mb-8">
   
   <!-- Skeleton Loader -->
   <div id="secondaryShim" class="shim-loader"></div>

   <!-- تحسين رابط الصورة بإضافة w_1200 و q_auto و f_auto -->
   <img data-src="https://res.cloudinary.com/dmakzfsc4/image/upload/w_1200,q_auto,f_auto/v1766467634/Jewellery_Store_1_wqegkl.jpg" 
        alt="Store Ad Banner" 
        class="object-cover w-full h-full absolute inset-0">
   
   <h2 class="text-xl lg:text-3xl font-bold text-center p-4 relative z-10"></h2>
</section>

<script>
    (function() {
        const bannerContainer = document.getElementById('secondaryBannerArea');
        const loaderShim = document.getElementById('secondaryShim');
        const bannerImg = bannerContainer.querySelector('img');

        const bannerObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    if (!bannerImg.src) { 
                        // البدء بالتحميل فوراً عند الظهور
                        bannerImg.src = bannerImg.dataset.src;
                        observer.unobserve(bannerContainer); 
                    }
                }
            });
        }, { rootMargin: '0px 0px 200px 0px' }); // يبدأ التحميل قبل وصول المستخدم بـ 200px

        bannerObserver.observe(bannerContainer);

        bannerImg.onload = () => {
            // إخفاء الـ Skeleton وإظهار الصورة والبانر
            loaderShim.style.opacity = '0';
            bannerContainer.classList.add('reveal-banner', 'loaded');
            // تأكيد الإخفاء التام للـ skeleton بعد انتهاء الأنميشن
            setTimeout(() => { loaderShim.style.display = 'none'; }, 500);
        };
    })();
</script>
