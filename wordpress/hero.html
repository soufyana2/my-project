<style>
    /* ===== Base ===== */
    :root {
        /* 
           قم بتغيير الرقم أدناه (80px) ليتناسب مع ارتفاع الهيدر (القائمة العلوية) في موقعك 
           إذا كانت القائمة تغطي جزءاً كبيراً، زد الرقم (مثلاً 100px أو 120px)

        --header-height-offset: 60px;

    .announcement-scroll-wrapper {

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const wrapper = document.getElementById('scrollWrapper');
        if(wrapper) {
            const item = wrapper.querySelector('.announcement-scroll-item');
            if(item) {
                const content = item.innerHTML;
                // تكرار العنصر لضمان استمرار الحركة بسلاسة
                for (let i = 0; i < 2; i++) { 
                    const clone = document.createElement('div');
                    clone.classList.add('announcement-scroll-item');
                    clone.innerHTML = content;
                    wrapper.appendChild(clone);
                }
            }
        }
    });
</script>
